spring:
  application:
    name: nexus-cxm

  datasource:
    url: jdbc:h2:mem:nexusdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: never

  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    path: /graphql
    schema:
      printer:
        enabled: true
    cors:
      allowed-origins: "http://localhost:3000"
      allowed-methods: "GET,POST,OPTIONS"

server:
  port: 8080

logging:
  level:
    com.nexus.cxm: DEBUG
    org.springframework.graphql: DEBUG
